
services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET:-8f4d9a2b5e1c7f0324896102abcdef12}
      DATABASE_URL: mysql://${MYSQL_USER:-planner_user}:${MYSQL_PASSWORD:-planner_pass}@database:3306/${MYSQL_DATABASE:-planner_db}?serverVersion=8.0&charset=utf8mb4
    volumes:
      - ./var:/var/www/html/var
    depends_on:
      database:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  database:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_pass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-planner_db}
      MYSQL_USER: ${MYSQL_USER:-planner_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-planner_pass}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - database_data:/var/lib/mysql

volumes:
  database_data:
